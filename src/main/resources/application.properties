# Informações da Aplicação
spring.application.name=ApiLari
server.port=${PORT:8080}

# Conexão MongoDB (Sensível - Injetado via Variável de Ambiente)
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:${MONGODB_URI:mongodb://localhost:27017/portfoliodb}}
spring.mongodb.uri=${spring.data.mongodb.uri}
spring.data.mongodb.database=${MONGODB_DATABASE:portfoliodb}


# Configurações de Segurança do Firebase
firebase.config.path=${FIREBASE_CONFIG_PATH:}
firebase.config.json=${FIREBASE_CONFIG_JSON:}

# Lista de E-mails ou UIDs autorizados como Administradores (separados por vírgula)
app.security.admin-emails=${ADMIN_EMAILS:}
app.security.admin-uids=${ADMIN_UIDS:}

# Configuração de CORS (URLs permitidas separadas por vírgula)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:3000}

# Prevenção de vazamento de informações em erros do Spring
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false
server.error.whitelabel.enabled=false